<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExperimentLab — Experiments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="index.html">Experiment<span>Lab</span></a>
<nav class="nav-links">
      <a href="index.html" class="active">Experiments</a>
    </nav>
  </header>

  <div class="page-head">
    <h1>Experiments</h1>
    <a class="btn primary" href="create.html">+ New experiment</a>
  </div>

  <div id="list"></div>
</div>

<script src="app.js"></script>
<script>
const listEl = document.getElementById("list");

async function load() {
  let items;
  try { items = await (await api("GET", "/api/experiments")).json(); }
  catch { listEl.innerHTML = `<div class="empty err">Couldn't reach the API. Is the app running?</div>`; return; }

  if (!items.length) {
    listEl.innerHTML = `
      <div class="empty">
        <h2>No experiments yet</h2>
        <p>Create your first experiment to start testing — no code, no setup.</p>
        <a class="btn primary" href="create.html">Create your first experiment</a>
      </div>`;
    return;
  }
  listEl.innerHTML = items.map(card).join("");
}

function card(e) {
  const chips = e.variants.map(v =>
    `<span class="chip ${v.isControl ? "ctrl" : ""}">${esc(v.name)} · ${v.trafficPercentage}%${v.isControl ? " · control" : ""}</span>`
  ).join("");
  const created = new Date(e.createdAt).toLocaleDateString();
  const lifecycle = e.status === "running"
    ? `<button class="btn" data-action="stop" data-id="${e.id}">Stop</button>`
    : `<button class="btn" data-action="start" data-id="${e.id}">Start</button>`;
  return `<div class="card">
    <div class="card-title-row">
      <span class="card-title">${esc(e.name)}</span>
      ${badge(e.status)}
    </div>
    ${e.description ? `<div class="card-desc">${esc(e.description)}</div>` : ""}
    <div class="chips">${chips}</div>
    <div class="card-meta">#${e.id} · created ${esc(created)}</div>
    <div class="card-actions">
      <a class="btn primary" href="results.html?id=${e.id}">View results</a>
      ${lifecycle}
      <button class="btn danger" data-action="delete" data-id="${e.id}" data-name="${esc(e.name)}">Delete</button>
    </div>
  </div>`;
}

listEl.addEventListener("click", async (ev) => {
  const btn = ev.target.closest("[data-action]");
  if (!btn) return;
  const id = +btn.dataset.id;
  const action = btn.dataset.action;

  if (action === "delete") {
    if (!confirm(`Delete "${btn.dataset.name}"? Its variants and events go too.`)) return;
    try {
      const r = await api("DELETE", `/api/experiments/${id}`);
      if (!r.ok) return toast(await r.text(), "error");
    } catch { return toast("Couldn't reach the API.", "error"); }
    toast("Experiment deleted.", "success");
    return load();
  }

  // start / stop
  try {
    const r = await api("POST", `/api/experiments/${id}/${action}`);
    if (!r.ok) return toast(await r.text(), "error");
  } catch { return toast("Couldn't reach the API.", "error"); }
  toast(`Experiment ${action === "start" ? "started" : "stopped"}.`, "success");
  load();
});

load();
</script>
</body>
</html>
